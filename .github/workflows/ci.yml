name: Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize] 
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
